# GitHub par push karte hi APK ban jaata hai: Actions tab -> latest run -> Artifacts -> MfcDash-debug-apk
# ubuntu-latest runner par Android SDK pehle se hota hai (ANDROID_HOME); jo platform/build-tools kam ho, Gradle khud download kar leta hai.
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MfcDash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Isi commit ki server PHP files (api/ + lib/): zip ko Plesk me mfc_dash/ folder me upload karke Extract karo (config files isme nahi hain)
      - uses: actions/upload-artifact@v4
        with:
          name: MFC-server-files
          path: |
            server/api/*.php
            server/lib/*.php
