# GitHub par push karte hi APK ban jaata hai: Actions tab -> latest run -> Artifacts -> MFC-apk
# Hamesha release APK (debuggable nahi = tez). Release key ke secrets (MFC_KEYSTORE_B64, MFC_KEYSTORE_PASS, MFC_KEY_ALIAS,
# MFC_KEY_PASS) hon to usi key se sign, warna debug key se.
# ubuntu-latest runner par Android SDK pehle se hota hai (ANDROID_HOME); jo platform/build-tools kam ho, Gradle khud download kar leta hai.
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Release key (GitHub secret)
        env:
          KS_B64: ${{ secrets.MFC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/mfc-release.jks"
            echo "MFC_KEYSTORE_FILE=$RUNNER_TEMP/mfc-release.jks" >> "$GITHUB_ENV"
          else
            echo "Release key secret nahi mila: release APK debug key se sign hoga"
          fi
      - name: Build APK
        env:
          MFC_KEYSTORE_PASS: ${{ secrets.MFC_KEYSTORE_PASS }}
          MFC_KEY_ALIAS: ${{ secrets.MFC_KEY_ALIAS }}
          MFC_KEY_PASS: ${{ secrets.MFC_KEY_PASS }}
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MFC-apk
          if-no-files-found: error
          path: app/build/outputs/apk/release/app-release.apk
      # Isi commit ki server files (api/ + lib/ PHP, setup/ read-only Ads Script): zip ko Plesk me mfc_dash/ folder me upload karke Extract karo (config files isme nahi hain)
      - uses: actions/upload-artifact@v4
        with:
          name: MFC-server-files
          path: |
            server/api/*.php
            server/lib/*.php
            server/setup/*.js
