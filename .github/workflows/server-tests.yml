# Google Ads AI Health Monitor: server tests (rules, read-only guard, MySQL integration with SIMULATED dev data)
name: Server tests
on:
  push:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  workflow_dispatch:
jobs:
  gads-monitor:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: mfc_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptestpass" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, iconv
          coverage: none
          ini-values: opcache.jit=disable
      - name: PHP syntax
        run: for f in server/lib/gads_*.php server/api/gads_*.php server/tests/*.php; do php -l "$f"; done
      - name: Read-only guard
        run: php server/tests/gads_readonly_check.php
      - name: Rule engine
        run: php server/tests/gads_rules_test.php
      - name: Integration (MySQL, simulated data)
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_NAME: mfc_test
          TEST_DB_USER: root
          TEST_DB_PASS: testpass
        run: php server/tests/gads_integration_test.php
